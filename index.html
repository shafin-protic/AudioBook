<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shafin's AudioBook</title>
    <!-- Embedded Audio Book Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
    <style>
        :root {
            --bg: #0b0d11;
            --surface: #14171f;
            --surface-elevated: #1e222d;
            --surface-border: #2a303f;
            --primary: #9d72ff;
            --primary-hover: #b08dff;
            --primary-glow: rgba(157, 114, 255, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.1);
            --accent-radio: #10b981;
            --accent-radio-glow: rgba(16, 185, 129, 0.25);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-theme {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-elevated: #f1f5f9;
            --surface-border: #e2e8f0;
            --primary: #7c3aed;
            --primary-hover: #6d28d9;
            --primary-glow: rgba(124, 58, 237, 0.18);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --accent-radio: #059669;
            --accent-radio-glow: rgba(5, 150, 105, 0.2);
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .player-card {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.45);
            animation: cardAppear 0.4s ease-out forwards;
            position: relative;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .library-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--surface-elevated);
        }

        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wave-container {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 18px;
        }

        .wave-bar {
            width: 3px;
            background: var(--primary);
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s ease, background-color 0.3s ease;
        }

        .radio-active .wave-bar {
            background: var(--accent-radio);
        }

        .playing .wave-bar:nth-child(1) { animation: wave 1s ease-in-out infinite 0.1s; }
        .playing .wave-bar:nth-child(2) { animation: wave 1s ease-in-out infinite 0.3s; }
        .playing .wave-bar:nth-child(3) { animation: wave 1s ease-in-out infinite 0.2s; }
        .playing .wave-bar:nth-child(4) { animation: wave 1s ease-in-out infinite 0.4s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 18px; }
        }

        .action-circle-btn {
            background: var(--surface-elevated);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .action-circle-btn:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .action-circle-btn.locked {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: var(--danger);
        }

        .status {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-block;
            transition: background 0.3s;
        }

        .status.radio-mode::before {
            background: var(--accent-radio);
            box-shadow: 0 0 6px var(--accent-radio);
        }

        .lockable.is-locked {
            opacity: 0.35 !important;
            pointer-events: none !important;
            user-select: none !important;
            filter: grayscale(40%);
            cursor: not-allowed !important;
        }

        /* Search Bar */
        .search-box-wrapper {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: var(--surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-icon-svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.72rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            transition: var(--transition);
            cursor: pointer;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 36px;
        }

        select optgroup {
            background: var(--surface);
            color: var(--primary);
            font-weight: 600;
            padding: 4px;
        }

        select option {
            background: var(--surface-elevated);
            color: var(--text-main);
            font-weight: normal;
        }

        select:focus, select:hover {
            border-color: var(--primary);
        }

        .progress-group {
            margin: 22px 0 16px;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 5px;
            background: var(--surface-elevated);
            border-radius: 99px;
            transition: var(--transition);
        }

        input[type="range"]:hover::-webkit-slider-runnable-track {
            background: var(--surface-border);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--primary);
            margin-top: -4.5px;
            box-shadow: 0 0 10px var(--primary-glow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.25);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px 0;
        }

        .btn-ctrl {
            background: var(--surface-elevated);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            height: 42px;
            padding: 0 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-ctrl:hover {
            border-color: var(--primary);
            background: var(--surface);
            transform: translateY(-1px);
        }

        .btn-ctrl:active {
            transform: translateY(0);
        }

        .btn-ctrl.btn-main {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            padding: 0;
            background: var(--primary);
            color: #ffffff;
            border: none;
            box-shadow: 0 6px 16px var(--primary-glow);
            font-size: 1.1rem;
        }

        .btn-ctrl.btn-main:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .extra-settings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: var(--surface-elevated);
            border-radius: var(--radius-md);
            margin: 16px 0;
        }

        .speed-dock {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speed-dock select {
            width: auto;
            padding: 4px 28px 4px 10px;
            font-size: 0.8rem;
            background-position: right 8px center;
        }

        .volume-dock {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 170px;
        }

        .volume-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            min-width: 32px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .secondary-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px dashed var(--surface-border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-secondary:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--surface-elevated);
        }

        .btn-radio {
            border: 1px solid var(--surface-border);
            background: var(--surface-elevated);
            color: var(--text-main);
        }

        .btn-radio.active {
            background: var(--accent-radio-glow);
            border-color: var(--accent-radio);
            color: var(--accent-radio);
            font-weight: 600;
        }

        .tabs-nav {
            display: flex;
            border-bottom: 1px solid var(--surface-border);
            gap: 16px;
            margin-bottom: 12px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 4px 12px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        .tab-panel {
            display: none;
            max-height: 220px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .tab-panel.active {
            display: block;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 4px;
        }

        .list-item:hover {
            background: var(--surface-elevated);
        }

        .list-item .item-title {
            font-weight: 500;
            color: var(--text-main);
        }

        .list-item .item-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .delete-btn:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        .empty-placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 24px 0;
            font-size: 0.85rem;
        }

        .footer-info {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 20px;
            opacity: 0.8;
        }

        /* --- SYNC CONFIG MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: cardAppear 0.25s ease-out forwards;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
        }

        .modal-input:focus {
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-modal-save {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-modal-save:hover {
            background: var(--primary-hover);
        }

        .btn-modal-clear {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--surface-border);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .modal-status {
            font-size: 0.78rem;
            margin-top: 8px;
            color: var(--text-muted);
            min-height: 1.2em;
        }

        audio { display: none; }
    </style>
</head>
<body>
    <div class="player-card">
        <header class="header">
            <div class="title-group">
                <img id="currentBookIcon" class="library-icon" src="https://img.icons8.com/?size=48&id=rRRmNzuBSYaF&format=png" alt="Library Icon" onerror="this.style.display='none'">
                <div class="wave-container" id="equalizer">
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                </div>
                <h1>Shafin's AudioBook</h1>
            </div>
            <div class="header-actions">
                <button class="action-circle-btn" id="openSyncModalBtn" title="Gist Sync Settings">⚙️</button>
                <a href="https://docs.google.com/spreadsheets/d/117xIFQKg282afXp02o1gHjpEx0Dzh9mEziYVXSASjw8/edit?" target="_blank" rel="noopener noreferrer" class="action-circle-btn" id="editSheetBtn" title="Edit Google Sheet">✏️</a>
                <button class="action-circle-btn" id="lockToggleBtn" title="Lock Controls">🔓</button>
                <button class="action-circle-btn" id="themeToggleBtn" title="Toggle Theme">🌓</button>
            </div>
        </header>

        <div class="status" id="status">Connecting to sync service...</div>

        <audio id="audioPlayer" preload="auto"></audio>

        <!-- Search Bar -->
        <div class="search-box-wrapper lockable">
            <svg class="search-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="librarySearchInput" class="search-input" placeholder="Search books or chapters...">
        </div>

        <div class="form-row lockable">
            <label for="collectionSelect">Audiobook Library</label>
            <select id="collectionSelect"></select>
        </div>

        <div class="form-row lockable">
            <label for="chapterSelect">Chapter</label>
            <select id="chapterSelect"></select>
        </div>

        <div class="progress-group lockable">
            <div class="time-labels">
                <span id="currentTimeDisplay">0:00</span>
                <span id="durationDisplay">0:00</span>
            </div>
            <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
        </div>

        <div class="player-controls">
            <button class="btn-ctrl lockable" id="prevChapterBtn" title="Previous Chapter">⏮</button>
            <button class="btn-ctrl lockable" id="rewind10Btn" title="Rewind 10s">⏪ 10s</button>
            <button class="btn-ctrl btn-main" id="playPauseBtn" title="Play / Pause">▶</button>
            <button class="btn-ctrl lockable" id="forward10Btn" title="Forward 10s">10s ⏩</button>
            <button class="btn-ctrl lockable" id="nextChapterBtn" title="Next Chapter">⏭</button>
        </div>

        <div class="extra-settings lockable">
            <div class="speed-dock">
                <label for="speedSelect" style="margin: 0;">Speed</label>
                <select id="speedSelect">
                    <option value="0.80">0.8x</option>
                    <option value="0.85">0.85x</option>
                    <option value="0.90">0.9x</option>
                    <option value="0.95">0.95x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.05">1.05x</option>
                    <option value="1.10">1.1x</option>
                    <option value="1.15">1.15x</option>
                    <option value="1.2">1.2x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
            </div>
            <div class="volume-dock">
                <span style="font-size: 0.85rem;">🔊</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                <span class="volume-label" id="volumeLabel">100%</span>
            </div>
        </div>

        <div class="secondary-actions">
            <button class="btn-secondary btn-radio lockable" id="radioToggleBtn">📻 Radio Mode</button>
            <button class="btn-secondary lockable" id="addBookmarkBtn">🔖 Add Bookmark</button>
        </div>

        <div class="tabs-nav lockable">
            <button class="tab-btn active" data-tab="bookmarks">Bookmarks</button>
            <button class="tab-btn" data-tab="history">History</button>
        </div>

        <div class="tab-panel active lockable" id="bookmarksTab">
            <div class="empty-placeholder">No bookmarks saved yet.</div>
        </div>
        <div class="tab-panel lockable" id="historyTab">
            <div class="empty-placeholder">No playback history yet.</div>
        </div>

        <div class="footer-info" id="syncTime"></div>
    </div>

    <!-- Sync Credentials Modal -->
    <div class="modal-overlay" id="syncModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Cloud Sync Settings</h2>
                <button class="modal-close-btn" id="closeSyncModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <div>
                    <label for="inputGithubToken">GitHub Token (Classic or Fine-Grained)</label>
                    <input type="password" id="inputGithubToken" class="modal-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                </div>
                <div>
                    <label for="inputGistId">Gist ID or Full URL</label>
                    <input type="text" id="inputGistId" class="modal-input" placeholder="e.g. 1a2b3c4d5e... or gist URL">
                </div>
                <div class="modal-status" id="modalStatusText">Credentials are stored locally in your browser.</div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-clear" id="clearSyncCredsBtn">Clear</button>
                <button class="btn-modal-save" id="saveSyncCredsBtn">Test & Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- STORAGE KEYS & INITIAL VALUES ---
        const STORAGE_KEY_TOKEN = "shafin_audiobook_token";
        const STORAGE_KEY_GIST = "shafin_audiobook_gist_id";

        let GITHUB_TOKEN = localStorage.getItem(STORAGE_KEY_TOKEN) || "";
        let GIST_ID = localStorage.getItem(STORAGE_KEY_GIST) || "";

        // --- UTILITIES ---
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function naturalSort(a, b) {
            return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatChapterName(filename) {
            let name = decodeURIComponent(filename);
            name = name.replace(/[_\-.]+/g, ' ').trim();
            name = name.replace(/\s+/g, ' ');
            return name;
        }

        function extractArchiveIdentifier(urlOrId) {
            if (!urlOrId) return "";
            const clean = urlOrId.trim();
            const match = clean.match(/(?:archive\.org\/(?:details|download)\/)?([^\/\?#]+)\/?$/i);
            return match ? match[1] : clean;
        }

        function getCleanGistId(raw) {
            const val = raw || GIST_ID || "";
            const parts = val.trim().split('/');
            return parts[parts.length - 1];
        }

        function parseCSVLine(text) {
            const result = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i + 1];
                if (c === '"') {
                    if (inQuotes && next === '"') {
                        cur += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    result.push(cur.trim());
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur.trim());
            return result;
        }

        // --- CSV COLLECTION LOADER ---
        async function loadCollectionsFromSheet() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("Could not load Google Sheet CSV");
                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
                if (lines.length <= 1) return;

                const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
                const nameIdx = headers.findIndex(h => h.includes("library") || h.includes("name") || h.includes("title"));
                const linkIdx = headers.findIndex(h => h.includes("link") || h.includes("url") || h.includes("identifier"));
                const iconIdx = headers.findIndex(h => h.includes("icon") || h.includes("image") || h.includes("thumb"));
                const groupIdx = headers.findIndex(h => h.includes("group") || h.includes("category"));

                const parsed = [];
                for (let i = 1; i < lines.length; i++) {
                    const row = parseCSVLine(lines[i]);
                    const rawLink = row[linkIdx !== -1 ? linkIdx : 1] || "";
                    const archiveId = extractArchiveIdentifier(rawLink);
                    const bookName = row[nameIdx !== -1 ? nameIdx : 0] || archiveId;
                    const iconUrl = iconIdx !== -1 ? row[iconIdx] : "";
                    const groupName = groupIdx !== -1 && row[groupIdx] ? row[groupIdx] : "General";

                    if (archiveId) {
                        parsed.push({
                            id: archiveId,
                            name: bookName,
                            icon: iconUrl,
                            group: groupName
                        });
                    }
                }

                if (parsed.length > 0) {
                    COLLECTIONS = parsed;
                }
            } catch (err) {
                console.warn("Failed loading collections from CSV, using defaults:", err);
            }
        }

        // --- CACHE & STREAMING ---
        async function fetchWithCache(url) {
            if (!('caches' in window)) return url;
            try {
                const cache = await caches.open(AUDIO_CACHE_NAME);
                const matched = await cache.match(url);
                if (matched) {
                    const blob = await matched.blob();
                    return URL.createObjectURL(blob);
                }
                fetch(url).then(response => {
                    if (response.ok) cache.put(url, response.clone());
                }).catch(() => {});
            } catch (err) {
                console.warn("Cache access error:", err);
            }
            return url;
        }

        function prefetchAdjacentChapters(currentIndex) {
            if (!('caches' in window) || currentChapters.length === 0) return;
            const nextIdx = currentIndex + 1;
            if (nextIdx < currentChapters.length) {
                caches.open(AUDIO_CACHE_NAME).then(cache => {
                    const nextUrl = currentChapters[nextIdx].url;
                    cache.match(nextUrl).then(matched => {
                        if (!matched) {
                            fetch(nextUrl).then(res => {
                                if (res.ok) cache.put(nextUrl, res);
                            }).catch(() => {});
                        }
                    });
                });
            }
        }

        // --- FETCH CHAPTERS ---
        async function fetchChapterList(identifier) {
            statusDiv.textContent = "Loading chapters from Archive.org...";
            try {
                const response = await fetch(`https://archive.org/metadata/${identifier}`);
                if (!response.ok) throw new Error("Failed to fetch metadata");
                const data = await response.json();
                const files = (data.files || []).filter(f => f.name.match(/\.(mp3|ogg|m4a|aac)$/i));
                files.sort(naturalSort);

                return files.map((f, idx) => {
                    const rawName = f.name;
                    const stripped = rawName.replace(/\.[^/.]+$/, "");
                    const formatted = formatChapterName(rawName);

                    let displayName;
                    const isNumericOnly = /^\d+$/.test(stripped.replace(/[_\-\s]/g, ''));
                    if (stripped.length < 4 || isNumericOnly) {
                        displayName = `#${idx + 1} — ${formatted}`;
                    } else {
                        displayName = formatted;
                    }

                    return {
                        name: displayName,
                        fullName: rawName,
                        url: `https://archive.org/download/${identifier}/${encodeURIComponent(rawName)}`
                    };
                });
            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Error loading Archive data. Check connection.";
                return [];
            }
        }

        async function loadChapter(index, autoPlay = false, seekOffset = null) {
            if (!currentChapters[index]) return;
            const chapter = currentChapters[index];
            isApplyingCloudState = true;

            const playbackSource = await fetchWithCache(chapter.url);
            audio.src = playbackSource;
            audio.load();
            chapterSelect.value = index;
            isApplyingCloudState = false;

            if (seekOffset !== null) {
                const applyOffset = () => {
                    if (audio.duration && isFinite(audio.duration)) {
                        audio.currentTime = Math.min(seekOffset, Math.max(0, audio.duration - 1));
                    }
                };
                if (audio.readyState >= 1) applyOffset();
                else audio.addEventListener('loadedmetadata', applyOffset, { once: true });
            }

            if (autoPlay) {
                audio.play().catch(e => console.log("Autoplay blocked:", e));
            }

            prefetchAdjacentChapters(index);
        }

        // --- RADIO MODE ---

        async function playRandomRadioSegment() {
            if (COLLECTIONS.length === 0) return;

            const randomColl = COLLECTIONS[Math.floor(Math.random() * COLLECTIONS.length)];
            if (randomColl.id !== currentCollectionId) {
                collectionSelect.value = randomColl.id;
                currentCollectionId = randomColl.id;
                updateHeaderIcon();
                currentChapters = await fetchChapterList(randomColl.id);
                populateChapterSelect(currentChapters);
            }

            if (currentChapters.length === 0) return;

            const randomChapterIdx = Math.floor(Math.random() * currentChapters.length);
            chapterSelect.value = randomChapterIdx;

            const targetChapter = currentChapters[randomChapterIdx];
            statusDiv.textContent = `📻 Radio: ${targetChapter.name}`;

            const playUrl = await fetchWithCache(targetChapter.url);
            audio.src = playUrl;
            audio.load();

            const onMetadataLoaded = () => {
                if (audio.duration && isFinite(audio.duration) && audio.duration > 30) {
                    const randomPoint = Math.random() * (audio.duration - 30);
                    audio.currentTime = randomPoint;
                }
                audio.play().catch(e => console.log("Radio playback interrupted:", e));
                audio.removeEventListener('loadedmetadata', onMetadataLoaded);
            };

            audio.addEventListener('loadedmetadata', onMetadataLoaded);
        }

        // --- GITHUB GIST SYNC ---
        async function fetchCloudState() {
            const cleanToken = (GITHUB_TOKEN || "").trim();
            const cleanId = getCleanGistId();

            if (!cleanToken || !cleanId) {
                syncTimeDiv.textContent = "Sync not configured. Click ⚙️ to setup.";
                return null;
            }
            try {
                const response = await fetch(`https://api.github.com/gists/${cleanId}`, {
                    headers: {
                        'Authorization': `token ${cleanToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (!response.ok) {
                    syncTimeDiv.textContent = `Sync read error: HTTP ${response.status}`;
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                const file = data.files && data.files[GIST_FILENAME];
                if (!file) return null;
                if (file.truncated && file.raw_url) {
                    const rawRes = await fetch(file.raw_url);
                    return await rawRes.json();
                }
                return JSON.parse(file.content);
            } catch (error) {
                console.error("Gist fetch error:", error);
                return null;
            }
        }

        async function pushCloudState(state) {
            if (isRadioMode) return;
            const cleanToken = (GITHUB_TOKEN || "").trim();
            const cleanId = getCleanGistId();

            if (!cleanToken || !cleanId) {
                syncTimeDiv.textContent = "Sync not configured. Click ⚙️ to setup.";
                return;
            }
            try {
                const payload = {
                    files: {
                        [GIST_FILENAME]: {
                            content: JSON.stringify(state, null, 2)
                        }
                    }
                };

                const response = await fetch(`https://api.github.com/gists/${cleanId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${cleanToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const now = new Date().toLocaleTimeString();
                    syncTimeDiv.textContent = `Auto-synced: ${now}`;
                } else {
                    syncTimeDiv.textContent = `Sync failed (HTTP ${response.status})`;
                }
            } catch (error) {
                console.error("Gist push error:", error);
                syncTimeDiv.textContent = "Sync failed (network error)";
            }
        }

        function scheduleSync() {
            if (isApplyingCloudState || isRadioMode) return;
            if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
            syncDebounceTimer = setTimeout(() => {
                syncState();
            }, 3000);
        }

        async function syncState(force = false) {
            if (isApplyingCloudState || isRadioMode) return;
            const state = getCurrentState();
            if (force || Math.abs(state.currentTime - lastSyncedTime) > 5 ||
                state.chapterIndex !== lastSyncedIndex) {
                await pushCloudState(state);
                lastSyncedTime = state.currentTime;
                lastSyncedIndex = state.chapterIndex;
            }
        }

        // --- BOOKMARKS & HISTORY RENDERING ---
        function renderBookmarks() {
            if (bookmarks.length === 0) {
                bookmarksTab.innerHTML = '<div class="empty-placeholder">No bookmarks saved yet.</div>';
                return;
            }
            bookmarksTab.innerHTML = bookmarks.map(bm => `
                <div class="list-item" data-id="${bm.id}">
                    <div>
                        <div class="item-title">${escapeHtml(bm.chapterName)} <span style="color:var(--primary); font-weight:normal;">(${formatTime(bm.time)})</span></div>
                        ${bm.note ? `<div class="item-subtitle">📝 ${escapeHtml(bm.note)}</div>` : ''}
                    </div>
                    <button class="delete-btn" data-delete="${bm.id}" title="Delete">✕</button>
                </div>
            `).join('');
        }

        function renderHistory() {
            if (history.length === 0) {
                historyTab.innerHTML = '<div class="empty-placeholder">No playback history yet.</div>';
                return;
            }
            historyTab.innerHTML = history.slice(0, 30).map(h => `
                <div class="list-item" data-history-id="${h.id}">
                    <div>
                        <div class="item-title">${escapeHtml(h.chapterName)}</div>
                        <div class="item-subtitle">${escapeHtml(h.collectionId)} • Last at: <strong style="color:var(--primary);">${formatTime(h.playbackPosition || 0)}</strong> • ${h.timePlayed}</div>
                    </div>
                </div>
            `).join('');
        }

        bookmarksTab.addEventListener('click', async (e) => {
            if (isLocked) return;
            const delBtn = e.target.closest('[data-delete]');
            if (delBtn) {
                const id = parseInt(delBtn.dataset.delete);
                bookmarks = bookmarks.filter(b => b.id !== id);
                renderBookmarks();
                scheduleSync();
                return;
            }
            const item = e.target.closest('.list-item');
            if (item && item.dataset.id) {
                const bm = bookmarks.find(b => b.id === parseInt(item.dataset.id));
                if (!bm) return;
                if (isRadioMode) toggleRadioMode();
                if (bm.collectionId !== currentCollectionId) {
                    collectionSelect.value = bm.collectionId;
                    await switchCollection(bm.collectionId);
                }
                if (currentChapters[bm.chapterIndex]) {
                    loadChapter(bm.chapterIndex, true, bm.time);
                }
            }
        });

        historyTab.addEventListener('click', async (e) => {
            if (isLocked) return;
            const item = e.target.closest('[data-history-id]');
            if (!item) return;
            const h = history.find(x => x.id === parseInt(item.dataset.historyId));
            if (!h) return;
            if (isRadioMode) toggleRadioMode();
            if (h.collectionId !== currentCollectionId) {
                collectionSelect.value = h.collectionId;
                await switchCollection(h.collectionId);
            }
            loadChapter(h.chapterIndex, true, h.playbackPosition || 0);
        });

        function addToHistory() {
            if (isRadioMode) return;
            const chapter = currentChapters[chapterSelect.value];
            if (!chapter) return;
            history = history.filter(h => !(h.collectionId === currentCollectionId && h.chapterIndex === parseInt(chapterSelect.value)));
            history.unshift({
                id: Date.now(),
                collectionId: currentCollectionId,
                chapterIndex: parseInt(chapterSelect.value),
                chapterName: chapter.name,
                playbackPosition: audio.currentTime || 0,
                timePlayed: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            history = history.slice(0, 50);
            renderHistory();
        }

        function updateCurrentHistoryPosition() {
            if (isRadioMode || !currentCollectionId) return;
            const currentIdx = parseInt(chapterSelect.value);
            const entry = history.find(h => h.collectionId === currentCollectionId && h.chapterIndex === currentIdx);
            if (entry) {
                entry.playbackPosition = audio.currentTime || 0;
                entry.timePlayed = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                renderHistory();
            }
        }

        // --- SYNC COORDINATION ---
        function getCurrentState() {
            return {
                collectionId: currentCollectionId,
                chapterIndex: parseInt(chapterSelect.value) || 0,
                currentTime: audio.currentTime || 0,
                playbackRate: audio.playbackRate || 1.0,
                volume: audio.volume,
                bookmarks: bookmarks,
                history: history,
                timestamp: Date.now()
            };
        }

        async function applyCloudState() {
            statusDiv.textContent = "Checking saved progress...";
            const cloudState = await fetchCloudState();

            if (cloudState) {
                bookmarks = cloudState.bookmarks || [];
                history = cloudState.history || [];
                renderBookmarks();
                renderHistory();

                if (cloudState.collectionId) {
                    const collection = COLLECTIONS.find(c => c.id === cloudState.collectionId);
                    if (collection) {
                        collectionSelect.value = collection.id;
                        currentCollectionId = collection.id;
                        updateHeaderIcon();
                        currentChapters = await fetchChapterList(collection.id);
                        populateChapterSelect(currentChapters);

                        isApplyingCloudState = true;
                        loadChapter(cloudState.chapterIndex, false, cloudState.currentTime);
                        audio.playbackRate = cloudState.playbackRate || 1.0;
                        speedSelect.value = audio.playbackRate;
                        if (cloudState.volume !== undefined) {
                            audio.volume = cloudState.volume;
                            volumeSlider.value = cloudState.volume;
                            volumeLabel.textContent = Math.round(cloudState.volume * 100) + "%";
                        }

                        statusDiv.textContent = `Resumed: ${collection.name}`;
                        return;
                    }
                }
            }
            statusDiv.textContent = "Ready.";
            if (COLLECTIONS.length > 0) {
                collectionSelect.value = COLLECTIONS[0].id;
                await switchCollection(COLLECTIONS[0].id);
            }
        }

        async function switchCollection(id) {
            currentCollectionId = id;
            updateHeaderIcon();
            currentChapters = await fetchChapterList(id);
            populateChapterSelect(currentChapters);
            if (currentChapters.length > 0) {
                loadChapter(0);
                statusDiv.textContent = `Loaded ${currentChapters.length} chapters.`;
            } else {
                statusDiv.textContent = "No audio files found.";
            }
        }

        async function init() {
            await loadCollectionsFromSheet();
            populateCollectionSelect();

            collectionSelect.addEventListener('change', async (e) => {
                await switchCollection(e.target.value);
                scheduleSync();
            });

            await applyCloudState();

            setInterval(() => {
                if (!audio.paused && !isRadioMode) {
                    updateCurrentHistoryPosition();
                    syncState();
                }
            }, 60000);

            window.addEventListener('beforeunload', () => {
                if (isRadioMode) return;
                updateCurrentHistoryPosition();
                const state = getCurrentState();
                const cleanToken = (GITHUB_TOKEN || "").trim();
                const cleanId = getCleanGistId();
                if (cleanToken && cleanId) {
                    fetch(`https://api.github.com/gists/${cleanId}`, {
                        method: 'PATCH',
                        keepalive: true,
                        headers: {
                            'Authorization': `token ${cleanToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            files: { [GIST_FILENAME]: { content: JSON.stringify(state) } }
                        })
                    }).catch(() => {});
                }
            });
        }

        init();
    </script>
</body>
</html>
